<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ACB57" />
      <stop offset="100%" stop-color="#389E35" />
    </linearGradient>
    <linearGradient id="shieldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#0E0E0E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge (Optional Dark) -->
  <rect width="200" height="200" rx="40" fill="#0E0E0E" stroke="#262626" stroke-width="2"/>
  
  <!-- Outer Shield Contour -->
  <path d="M 100 28 L 155 52 C 155 105 130 148 100 168 C 70 148 45 105 45 52 Z" 
        fill="url(#shieldDark)" stroke="#303030" stroke-width="3"/>
        
  <!-- Glowing Left Wing / Shield Accent -->
  <path d="M 100 36 L 145 56 C 145 98 124 135 100 152 L 100 36 Z" 
        fill="url(#shieldGrad)" opacity="0.95"/>
        
  <!-- Inner Dynamic Chevron / Heartbeat Pulse -->
  <path d="M 72 98 L 90 98 L 98 80 L 108 116 L 118 92 L 124 98 L 132 98" 
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Core Accent Dot -->
  <circle cx="100" cy="138" r="4" fill="#5ACB57" filter="url(#glow)"/>
</svg>

